[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "oata"
version = "0.1.0a1"
description = "OWASP Agentic Threat Auditor (OATA) - Dynamic Penetration Testing & Excessive Agency Auditing Toolkit for Multi-Hop AI Agents"
readme = "README.md"
requires-python = ">=3.10"
license = "Apache-2.0"
authors = [
    { name = "Kashish Kanojia", email = "kashish.kanojia@owasp.org" }
]
keywords = [
    "owasp",
    "security",
    "penetration-testing",
    "red-team",
    "ai-security",
    "agentic-ai",
    "llm08",
    "excessive-agency",
    "mcp",
    "sarif"
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]
dependencies = [
    "click>=8.1.0",
    "rich>=13.0.0",
    "pydantic>=2.0.0",
    "httpx>=0.25.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.5.0",
]

[project.scripts]
oata = "oata.cli:main"

[project.urls]
Homepage = "https://owasp.org/projects/agentic-threat-auditor"
Repository = "https://github.com/OWASP/Agentic-Threat-Auditor"
Documentation = "https://github.com/OWASP/Agentic-Threat-Auditor#readme"
Issues = "https://github.com/OWASP/Agentic-Threat-Auditor/issues"

[tool.hatch.build.targets.wheel]
packages = ["oata"]

[tool.pytest.ini_options]
testpaths = ["tests"]
